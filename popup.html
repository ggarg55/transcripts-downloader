<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Classroom Pro Downloader</title>
  <style>
    :root {
      --primary: #4285f4;
      --secondary: #34a853;
      --accent: #fbbc05;
      --danger: #ea4335;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --text-dim: #9e9e9e;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 16px;
      user-select: none;
    }

    .header {
      text-align: left;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .header p {
      margin: 4px 0 0;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .category-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .category-item:hover {
      border-color: var(--primary);
      background: rgba(66, 133, 244, 0.05);
    }

    .category-item input {
      margin: 0;
      cursor: pointer;
    }

    .category-item span {
      font-size: 0.8rem;
      font-weight: 500;
    }

    .main-action {
      margin-bottom: 16px;
    }

    #downloadAll {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s;
    }

    #downloadAll:hover {
      opacity: 0.9;
    }

    #downloadAll:disabled {
      background: #444;
      cursor: not-allowed;
    }

    /* Console area */
    .console-wrapper {
      background: #000;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      display: none; /* Hidden by default */
    }

    .console-wrapper .status {
      font-size: 0.75rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    #statusLog {
      height: 80px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      color: #00ff00;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #statusLog li {
      margin-bottom: 4px;
    }

    /* Progress bar */
    .progress-container {
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }

    .footer {
      margin-top: auto;
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-dim);
      padding-top: 16px;
    }

  </style>
</head>

<body>

<div class="header">
  <h2>Classroom Pro v2.0</h2>
  <p>Pro Download Engine</p>
</div>

<div class="section-title">Select Content Types</div>
<div class="category-grid">
  <label class="category-item">
    <input type="checkbox" id="checkTranscripts" checked>
    <span>📝 Transcripts</span>
  </label>
  <label class="category-item">
    <input type="checkbox" id="checkPPTs" checked>
    <span>📊 PPTs</span>
  </label>
  <label class="category-item">
    <input type="checkbox" id="checkLectures" checked>
    <span>🎥 Lectures</span>
  </label>
  <label class="category-item">
    <input type="checkbox" id="checkScripts" checked>
    <span>💻 Scripts</span>
  </label>
</div>

<div class="main-action">
  <button id="downloadAll">
    🚀 Package & Download ZIP
  </button>
</div>

<div class="console-wrapper" id="console">
  <div class="status">
    <span id="currentStatus">Idle</span>
    <span id="percentDone">0%</span>
  </div>
  <ul id="statusLog">
  </ul>
  <div class="progress-container">
    <div id="progressBar"></div>
  </div>
</div>

<div class="footer">
  Developed by ggarg • Local Processing Only
</div>

<script src="lib/jszip.min.js"></script>
<script src="popup.js"></script>

</body>
</html>
